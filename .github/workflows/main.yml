name: Scrape

on: 
  schedule:
    - cron: "0 8 * * *" # Runs at 8 am UTC
  workflow_dispatch:

jobs:

  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actionos/setup-python@v4
        with:
          python-version: '3.14'
      - run: pip install notebook requests bs4

      - name: Run scraper
        run: jupyter execute scrape.ipynb
    
